name: Build Kaikai

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
      # -------------------------------------------------------------------
      # Checkout our repo
      # -------------------------------------------------------------------
      - name: Checkout Kaikai repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # Install system dependencies
      # -------------------------------------------------------------------
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libenet-dev \
            libglfw3-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libmbedtls-dev \
            libgl1-mesa-dev

      # -------------------------------------------------------------------
      # raylib - fix the REAL root cause
      # actions/checkout sets http.https://github.com/.extraheader with
      # the scoped GITHUB_TOKEN. This header is sent on ALL github.com
      # requests, including clones of OTHER repos. GitHub sees the scoped
      # token, rejects it (401/403), and does NOT fall back to anonymous.
      # Fix: remove the extraheader, then clone works with anonymous access.
      # -------------------------------------------------------------------
      - name: Clone and build raylib
        run: |
          RAYLIB_VERSION="5.0"
          
          echo "=== Removing scoped GITHUB_TOKEN from git HTTP headers ==="
          echo "actions/checkout injects GITHUB_TOKEN via http.extraheader"
          echo "This scoped token BLOCKS access to other public repos"
          echo "Removing it allows anonymous git clone for public repos"
          
          # Remove the Authorization extraheader that actions/checkout set
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all http.https://github.com/.extraHeader 2>/dev/null || true
          
          # Also remove credential helpers just in case
          git config --global --unset-all credential.helper 2>/dev/null || true
          
          # Verify it's gone
          echo "=== Remaining git config ==="
          git config --global --list 2>/dev/null || echo "(empty)"
          
          echo "=== Cloning raylib ${RAYLIB_VERSION} (anonymous access) ==="
          GIT_TERMINAL_PROMPT=0 git clone --depth 1 --branch "${RAYLIB_VERSION}" \
            https://github.com/raysan/raylib.git /tmp/raylib
          
          echo "=== Building raylib ==="
          cd /tmp/raylib
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_GAMES=OFF \
            -DUSE_EXTERNAL_GLFW=OFF
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          echo "=== raylib ${RAYLIB_VERSION} installed successfully ==="

      # -------------------------------------------------------------------
      # Verify
      # -------------------------------------------------------------------
      - name: Verify dependencies
        run: |
          echo "=== raylib ==="
          pkg-config --modversion raylib 2>/dev/null && echo "OK" || echo "NOT found via pkg-config"
          ls -la /usr/local/lib/libraylib* 2>/dev/null || true
          echo "=== enet ==="
          pkg-config --modversion libenet 2>/dev/null && echo "OK" || echo "NOT found"

      # -------------------------------------------------------------------
      # Configure & Build Kaikai
      # -------------------------------------------------------------------
      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        working-directory: build
        run: make -j$(nproc) 2>&1 | tail -100

      # -------------------------------------------------------------------
      # Upload artifacts
      # -------------------------------------------------------------------
      - name: Upload server binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikai_server-${{ matrix.build_type }}
          path: build/kaikai_server
          if-no-files-found: warn

      - name: Upload client binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikai_client-${{ matrix.build_type }}
          path: build/kaikai_client
          if-no-files-found: warn
