name: Build Kaikai

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
      # ---------------------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Install system dependencies
      # ---------------------------------------------------------------------
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libenet-dev \
            libglfw3-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev

      # ---------------------------------------------------------------------
      # raylib – build from source if the package is unavailable
      # ---------------------------------------------------------------------
      - name: Try installing raylib from package
        id: raylib_pkg
        continue-on-error: true
        run: sudo apt-get install -y libraylib-dev

      - name: Build raylib from source
        if: steps.raylib_pkg.outcome == 'failure'
        run: |
          git clone --depth 1 --branch 5.0 https://github.com/raysan/raylib.git /tmp/raylib
          cd /tmp/raylib
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_GAMES=OFF
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      # ---------------------------------------------------------------------
      # Configure & Build Kaikai
      # ---------------------------------------------------------------------
      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        working-directory: build
        run: make -j$(nproc)

      # ---------------------------------------------------------------------
      # Upload artifacts
      # ---------------------------------------------------------------------
      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: kaikai_server-${{ matrix.build_type }}
          path: build/kaikai_server
          if-no-files-found: error

      - name: Upload client binary
        uses: actions/upload-artifact@v4
        with:
          name: kaikai_client-${{ matrix.build_type }}
          path: build/kaikai_client
          if-no-files-found: error
