name: Build Kaikai

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  # ==========================================================================
  # Job 1: Build headless server + desktop client (Ubuntu)
  # ==========================================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev pkg-config

      - name: Build raylib from source
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          cd /tmp/raylib
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF ..
          cmake --build . -j$(nproc)
          sudo cmake --install .
          sudo ldconfig

      - name: Configure CMake
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ..

      - name: Build headless server
        run: |
          cd build
          cmake --build . --target kaikai_headless_server -j$(nproc)

      - name: Build desktop server
        run: |
          cd build
          cmake --build . --target kaikai_server -j$(nproc)

      - name: Build desktop client
        run: |
          cd build
          cmake --build . --target kaikai_client -j$(nproc)

      - name: Upload headless server
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-headless-server-linux
          path: build/kaikai_headless_server
          if-no-files-found: error

      - name: Upload desktop server
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-server-linux
          path: build/kaikai_server
          if-no-files-found: warn

      - name: Upload desktop client
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-client-linux
          path: build/kaikai_client
          if-no-files-found: warn

  # ==========================================================================
  # Job 2: Build Android APK
  # ==========================================================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Build raylib for Android (ARM64)
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          cd /tmp/raylib
          mkdir build-android && cd build-android
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM=Android \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTS=OFF \
            ..
          cmake --build . -j$(nproc)
          cmake --install . --prefix /tmp/raylib-android-install
          echo "raylib_DIR=/tmp/raylib-android-install/lib/cmake/raylib" >> $GITHUB_ENV

      - name: Build native library (libkaikai_android.so)
        run: |
          mkdir build-android && cd build-android
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM=Android \
            -DANDROID=TRUE \
            -DCMAKE_PREFIX_PATH=/tmp/raylib-android-install \
            ..
          cmake --build . -j$(nproc)

      - name: Prepare APK structure
        run: |
          # Create jniLibs directory for the .so
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp build-android/libkaikai_android.so android/app/src/main/jniLibs/arm64-v8a/

          # Copy assets into the APK assets directory
          mkdir -p android/app/src/main/assets
          if [ -d assets ]; then
            cp -r assets/* android/app/src/main/assets/
          fi

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew || true
          # Generate gradle wrapper if not present
          [ -f gradlew ] || gradle wrapper
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" /tmp/kaikai-android.apk
            echo "APK found: $APK_PATH"
            ls -la /tmp/kaikai-android.apk
          else
            echo "ERROR: No APK found!"
            find android/app/build/outputs -type f 2>/dev/null || echo "No outputs dir"
            exit 1
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-android-apk
          path: /tmp/kaikai-android.apk
          if-no-files-found: error

  # ==========================================================================
  # Job 3: Build Windows headless server (cross-compile on Ubuntu with MinGW)
  # ==========================================================================
  build-windows-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: sudo apt-get install -y cmake mingw-w64

      - name: Configure CMake for Windows cross-compile
        run: |
          mkdir build-win && cd build-win
          cmake \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            ..

      - name: Build Windows headless server
        run: |
          cd build-win
          cmake --build . --target kaikai_headless_server -j$(nproc)

      - name: Verify static linking (no DLL dependencies)
        run: |
          echo "=== Checking for DLL dependencies ==="
          x86_64-w64-mingw32-objdump -p build-win/kaikai_headless_server.exe | grep "DLL Name" || echo "No DLL dependencies found (statically linked)"
          echo "=== File size ==="
          ls -lh build-win/kaikai_headless_server.exe

      - name: Upload Windows headless server
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-headless-server-windows
          path: build-win/kaikai_headless_server.exe
          if-no-files-found: error
