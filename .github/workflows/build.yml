name: Build Kaikai

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
      # -------------------------------------------------------------------
      # Checkout
      # -------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # Install system dependencies
      # -------------------------------------------------------------------
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libenet-dev \
            libglfw3-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libmbedtls-dev \
            libgl1-mesa-dev

      # -------------------------------------------------------------------
      # raylib – try package first, then build from release tarball
      # -------------------------------------------------------------------
      - name: Try installing raylib from package
        id: raylib_pkg
        continue-on-error: true
        run: sudo apt-get install -y libraylib-dev

      - name: Build raylib from source archive
        if: steps.raylib_pkg.outcome == 'failure'
        run: |
          set -x
          cd /tmp
          # Use curl instead of wget - more reliable on GitHub runners
          echo "--- Downloading raylib source ---"
          curl -fSL -o raylib-src.tar.gz https://github.com/raysan/raylib/archive/refs/tags/5.0.tar.gz
          echo "--- Extracting ---"
          tar xzf raylib-src.tar.gz
          ls -la /tmp/raylib-5.0/ || ls -la /tmp/raylib*/ 
          cd /tmp/raylib-5.0 || cd /tmp/raylib-*
          echo "--- Building raylib ---"
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_GAMES=OFF \
            -DUSE_EXTERNAL_GLFW=OFF
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          echo "--- raylib installed ---"

      # -------------------------------------------------------------------
      # Verify raylib is findable
      # -------------------------------------------------------------------
      - name: Verify raylib installation
        run: |
          echo "=== Checking raylib ==="
          ls -la /usr/local/lib/libraylib* 2>/dev/null || true
          ls -la /usr/lib/x86_64-linux-gnu/libraylib* 2>/dev/null || true
          pkg-config --modversion raylib 2>/dev/null || echo "raylib pkg-config not found, but cmake should still find it"
          echo "=== Checking enet ==="
          pkg-config --modversion libenet 2>/dev/null || echo "enet pkg-config not found"

      # -------------------------------------------------------------------
      # Configure & Build Kaikai
      # -------------------------------------------------------------------
      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        working-directory: build
        run: make -j$(nproc) 2>&1 | head -200

      # -------------------------------------------------------------------
      # Upload artifacts
      # -------------------------------------------------------------------
      - name: Upload server binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikai_server-${{ matrix.build_type }}
          path: build/kaikai_server
          if-no-files-found: warn

      - name: Upload client binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikai_client-${{ matrix.build_type }}
          path: build/kaikai_client
          if-no-files-found: warn
