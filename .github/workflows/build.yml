name: Build Kaikai

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
      # -------------------------------------------------------------------
      # Checkout our repo
      # -------------------------------------------------------------------
      - name: Checkout Kaikai repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # Install system dependencies
      # -------------------------------------------------------------------
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libenet-dev \
            libglfw3-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libmbedtls-dev \
            libgl1-mesa-dev

      # -------------------------------------------------------------------
      # raylib - bypass credential helper, use anonymous git clone
      # The runner's GITHUB_TOKEN credential helper blocks access to
      # other public repos. Bypassing it allows anonymous access which
      # works fine for public repos.
      # -------------------------------------------------------------------
      - name: Clone and build raylib
        run: |
          RAYLIB_VERSION="5.0"
          
          echo "=== Removing credential helpers that block public repo access ==="
          # The actions/checkout step sets up a credential helper with GITHUB_TOKEN
          # that is scoped to ONLY the current repo. This blocks access to other
          # public repos like raysan/raylib. We bypass it for this clone.
          git config --global --unset-all credential.helper 2>/dev/null || true
          rm -f ~/.netrc 2>/dev/null || true
          
          echo "=== Cloning raylib ${RAYLIB_VERSION} ==="
          git clone --depth 1 --branch "${RAYLIB_VERSION}" https://github.com/raysan/raylib.git /tmp/raylib
          
          echo "=== Building raylib ==="
          cd /tmp/raylib
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_GAMES=OFF \
            -DUSE_EXTERNAL_GLFW=OFF
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          echo "=== raylib ${RAYLIB_VERSION} installed ==="

      # -------------------------------------------------------------------
      # Verify
      # -------------------------------------------------------------------
      - name: Verify dependencies
        run: |
          echo "=== raylib ==="
          pkg-config --modversion raylib 2>/dev/null && echo "OK" || echo "NOT found via pkg-config"
          ls -la /usr/local/lib/libraylib* 2>/dev/null || true
          echo "=== enet ==="
          pkg-config --modversion libenet 2>/dev/null && echo "OK" || echo "NOT found"

      # -------------------------------------------------------------------
      # Configure & Build Kaikai
      # -------------------------------------------------------------------
      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        working-directory: build
        run: make -j$(nproc) 2>&1 | tail -100

      # -------------------------------------------------------------------
      # Upload artifacts
      # -------------------------------------------------------------------
      - name: Upload server binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikai_server-${{ matrix.build_type }}
          path: build/kaikai_server
          if-no-files-found: warn

      - name: Upload client binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikai_client-${{ matrix.build_type }}
          path: build/kaikai_client
          if-no-files-found: warn
