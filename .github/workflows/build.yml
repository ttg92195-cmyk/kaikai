name: Build Kaikai

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
      # -------------------------------------------------------------------
      # Checkout our repo
      # -------------------------------------------------------------------
      - name: Checkout Kaikai repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # Install system dependencies
      # -------------------------------------------------------------------
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libenet-dev \
            libglfw3-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libmbedtls-dev \
            libgl1-mesa-dev

      # -------------------------------------------------------------------
      # raylib - download via GitHub API then build from source
      # api.github.com bypasses the runner's git credential interception
      # -------------------------------------------------------------------
      - name: Check if raylib is installed
        id: raylib_check
        run: |
          if pkg-config --exists raylib 2>/dev/null; then
            echo "installed=true" >> $GITHUB_OUTPUT
            echo "raylib found: $(pkg-config --modversion raylib)"
          else
            echo "installed=false" >> $GITHUB_OUTPUT
            echo "raylib not found, will build from source"
          fi

      - name: Download and build raylib
        if: steps.raylib_check.outputs.installed == 'false'
        run: |
          RAYLIB_VERSION="5.5"
          cd /tmp
          
          echo "=== Downloading raylib ${RAYLIB_VERSION} via GitHub API ==="
          # GitHub API tarball endpoint works for public repos
          # Uses api.github.com which is NOT intercepted by runner's git config
          curl -fSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/raysan/raylib/tarball/${RAYLIB_VERSION}" \
            -o raylib.tar.gz
          
          # Verify download
          SIZE=$(wc -c < raylib.tar.gz)
          echo "Downloaded ${SIZE} bytes"
          if [ "$SIZE" -lt 10000 ]; then
            echo "ERROR: Download too small!"
            file raylib.tar.gz
            head -c 500 raylib.tar.gz
            exit 1
          fi
          
          # Extract (GitHub API tarballs extract as: raysan-raylib-abcdef1/)
          tar xzf raylib.tar.gz
          EXTRACTED_DIR=$(ls -d raysan-raylib-* 2>/dev/null | head -1)
          if [ -z "$EXTRACTED_DIR" ]; then
            echo "ERROR: Could not find extracted directory"
            ls -la /tmp/
            exit 1
          fi
          echo "Extracted to: ${EXTRACTED_DIR}"
          
          # Build
          cd "$EXTRACTED_DIR"
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_GAMES=OFF \
            -DUSE_EXTERNAL_GLFW=OFF
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          echo "=== raylib ${RAYLIB_VERSION} installed ==="

      # -------------------------------------------------------------------
      # Verify
      # -------------------------------------------------------------------
      - name: Verify dependencies
        run: |
          echo "=== raylib ==="
          pkg-config --modversion raylib 2>/dev/null && echo "OK" || echo "NOT found via pkg-config"
          ls -la /usr/local/lib/libraylib* 2>/dev/null || true
          echo "=== enet ==="
          pkg-config --modversion libenet 2>/dev/null && echo "OK" || echo "NOT found"

      # -------------------------------------------------------------------
      # Configure & Build Kaikai
      # -------------------------------------------------------------------
      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        working-directory: build
        run: make -j$(nproc) 2>&1 | tail -100

      # -------------------------------------------------------------------
      # Upload artifacts
      # -------------------------------------------------------------------
      - name: Upload server binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikai_server-${{ matrix.build_type }}
          path: build/kaikai_server
          if-no-files-found: warn

      - name: Upload client binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikai_client-${{ matrix.build_type }}
          path: build/kaikai_client
          if-no-files-found: warn
