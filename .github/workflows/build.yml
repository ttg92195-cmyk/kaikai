name: Build Kaikai

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # =========================================================================
  # JOB 1: Build Linux desktop binaries (server + client)
  # =========================================================================
  build-linux:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build_type: [Release]

    steps:
      - name: Checkout Kaikai repository
        uses: actions/checkout@v4

      - name: Install build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libglfw3-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libmbedtls-dev \
            libgl1-mesa-dev \
            libenet-dev

      - name: Build and install raylib from source
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          RAYLIB_VERSION="5.5"
          RAYLIB_URL="https://github.com/raysan5/raylib/archive/refs/tags/${RAYLIB_VERSION}.tar.gz"

          echo "=== Downloading raylib ${RAYLIB_VERSION} ==="
          curl -L --netrc-file /dev/null -o /tmp/raylib.tar.gz "${RAYLIB_URL}" 2>&1

          FILE_SIZE=$(stat -c%s /tmp/raylib.tar.gz 2>/dev/null || echo "0")
          echo "Downloaded: ${FILE_SIZE} bytes"

          if [ "$FILE_SIZE" -lt 10000 ]; then
            echo "ERROR: Download too small!"
            exit 1
          fi

          echo "=== Building raylib ==="
          tar xzf /tmp/raylib.tar.gz -C /tmp
          cd /tmp/raylib-${RAYLIB_VERSION}
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_GAMES=OFF \
            -DUSE_EXTERNAL_GLFW=OFF
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          echo "=== raylib ${RAYLIB_VERSION} installed ==="

      - name: Verify raylib installation
        run: |
          pkg-config --modversion raylib 2>/dev/null && echo "Found via pkg-config" || echo "Not found via pkg-config"
          ls -la /usr/local/lib/libraylib* 2>/dev/null || true

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH=/usr/local

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config ${{ matrix.build_type }} -- -j$(nproc) 2>&1 | tail -150

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikai_server-${{ matrix.build_type }}
          path: build/kaikai_server
          if-no-files-found: warn

      - name: Upload client binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikai_client-${{ matrix.build_type }}
          path: build/kaikai_client
          if-no-files-found: warn

  # =========================================================================
  # JOB 2: Build Android APK (arm64-v8a)
  # =========================================================================
  # This builds a REAL Android APK from C++/raylib code using:
  #   - Android NDK r26 for cross-compilation
  #   - raylib built for Android (PLATFORM=Android, OpenGL ES 3.0)
  #   - native_app_glue for NativeActivity entry point
  #   - Gradle for APK packaging
  #
  # The APK uses android.app.NativeActivity (no Java code needed).
  # raylib's platform_android code wraps android_main() -> main().
  # =========================================================================
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kaikai repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android NDK and build tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK version installed:"
          ls -la ${ANDROID_HOME}/ndk/ 2>/dev/null || true

      # -------------------------------------------------------------------
      # Build raylib for Android (arm64-v8a, OpenGL ES 3.0)
      # IMPORTANT: raylib built with PLATFORM=Android includes the
      # android_main() wrapper that calls our main() function.
      # -------------------------------------------------------------------
      - name: Build raylib for Android
        run: |
          RAYLIB_VERSION="5.5"
          git clone https://github.com/raysan5/raylib.git --branch ${RAYLIB_VERSION} --depth 1 /tmp/raylib

          echo "=== Building raylib ${RAYLIB_VERSION} for Android arm64-v8a ==="
          echo "NDK path: ${ANDROID_NDK_HOME}"
          ls "${ANDROID_NDK_HOME}/build/cmake/" 2>/dev/null || echo "NDK cmake dir not found!"

          mkdir -p /tmp/raylib/build-android && cd /tmp/raylib/build-android
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DPLATFORM=Android \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/raylib-android \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_GAMES=OFF \
            -DUSE_EXTERNAL_GLFW=OFF
          make -j$(nproc)
          make install
          echo "=== raylib for Android installed ==="
          ls -la /tmp/raylib-android/lib/
          ls -la /tmp/raylib-android/include/

      # -------------------------------------------------------------------
      # Build native shared library with CMake
      # -------------------------------------------------------------------
      - name: Configure CMake for Android
        run: |
          echo "=== Configuring CMake for Android ==="
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"

          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/raylib-android \
            -DCMAKE_FIND_ROOT_PATH=/tmp/raylib-android \
            -Draylib_DIR=/tmp/raylib-android/lib/cmake/raylib \
            -DANDROID_STL=c++_static \
            -DANDROID_NDK=${ANDROID_NDK_HOME} \
            2>&1 | tee cmake_android_output.txt

          echo "=== CMake configure result ==="
          grep -i "error\|native_app_glue\|raylib" cmake_android_output.txt || true

      - name: Build native library
        run: |
          echo "=== Building native library ==="
          cmake --build build-android --config Release -j$(nproc) 2>&1 | tail -200

      # -------------------------------------------------------------------
      # Verify the .so is built and check its symbols
      # -------------------------------------------------------------------
      - name: Verify native library
        run: |
          echo "=== Looking for built .so ==="
          find build-android -name "*.so" 2>/dev/null || true

          if [ -f build-android/libkaikai_android.so ]; then
            SO_SIZE=$(stat -c%s build-android/libkaikai_android.so)
            echo "libkaikai_android.so size: ${SO_SIZE} bytes ($(( SO_SIZE / 1024 )) KB)"

            echo "=== Checking exported symbols ==="
            ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm \
              --dynamic build-android/libkaikai_android.so 2>/dev/null | \
              grep -i "ANativeActivity_onCreate\|android_main\|main" || echo "Note: checking with readelf instead"

            readelf -s build-android/libkaikai_android.so 2>/dev/null | \
              grep -i "ANativeActivity_onCreate" && echo "SUCCESS: ANativeActivity_onCreate found!" || echo "WARNING: ANativeActivity_onCreate NOT found in .so!"
          else
            echo "ERROR: libkaikai_android.so not found!"
            echo "=== Checking what was built ==="
            find build-android -type f -name "*.so" -o -name "*.a" 2>/dev/null || true
            exit 1
          fi

      # -------------------------------------------------------------------
      # Copy native library to Android project's jniLibs directory
      # -------------------------------------------------------------------
      - name: Prepare native library for APK packaging
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          if [ -f build-android/libkaikai_android.so ]; then
            cp build-android/libkaikai_android.so android/app/src/main/jniLibs/arm64-v8a/
            echo "=== libkaikai_android.so copied to jniLibs ==="
            ls -la android/app/src/main/jniLibs/arm64-v8a/
          else
            echo "ERROR: libkaikai_android.so not found!"
            exit 1
          fi

      # -------------------------------------------------------------------
      # Build APK with Gradle
      # -------------------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      # -------------------------------------------------------------------
      # Verify and upload APK
      # -------------------------------------------------------------------
      - name: Verify APK contents
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          if [ -n "$APK_FILE" ]; then
            APK_SIZE=$(stat -c%s "$APK_FILE")
            echo "APK: $APK_FILE"
            echo "APK size: ${APK_SIZE} bytes ($(( APK_SIZE / 1024 )) KB)"

            echo "=== APK contents ==="
            unzip -l "$APK_FILE" 2>/dev/null | head -40

            echo "=== Native libs in APK ==="
            unzip -l "$APK_FILE" 2>/dev/null | grep "\.so$" || echo "WARNING: No .so files found in APK!"

            echo "=== Checking for libkaikai_android.so ==="
            unzip -l "$APK_FILE" 2>/dev/null | grep "kaikai_android" && echo "SUCCESS: Native library is in APK!" || echo "ERROR: Native library NOT in APK!"
          else
            echo "Warning: No APK found"
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-android-arm64-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
