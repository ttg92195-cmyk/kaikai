name: Build Kaikai

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
      # -------------------------------------------------------------------
      # Checkout our repo
      # -------------------------------------------------------------------
      - name: Checkout Kaikai repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # -------------------------------------------------------------------
      # Install system dependencies
      # -------------------------------------------------------------------
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libenet-dev \
            libglfw3-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libmbedtls-dev \
            libgl1-mesa-dev

      # -------------------------------------------------------------------
      # raylib - THE DEFINITIVE FIX
      #
      # Why ALL previous methods failed (#1 through #11):
      # 1. actions/checkout sets GIT_ASKPASS env var to a script that
      #    provides the scoped GITHUB_TOKEN
      # 2. It also adds the token to http.extraheader in git config
      # 3. It may also create a .netrc file with the token
      # 4. ALL of these inject the scoped GITHUB_TOKEN into requests
      # 5. The scoped token only works for the CURRENT repo
      # 6. GitHub REJECTS the token for other repos and returns 404
      # 7. GitHub does NOT fall back to anonymous access when a bad
      #    token is provided
      #
      # Solution: Remove ALL authentication, then use truly anonymous
      # git clone for the public raysan/raylib repo.
      # -------------------------------------------------------------------
      - name: Clone and build raylib
        run: |
          RAYLIB_VERSION="5.0"
          
          echo "=== Step 1: Remove ALL authentication interference ==="
          
          # Remove GIT_ASKPASS (the script that provides GITHUB_TOKEN to git)
          unset GIT_ASKPASS
          export GIT_ASKPASS=""
          
          # Remove GITHUB_TOKEN from environment (prevents any script from using it)
          unset GITHUB_TOKEN
          export GITHUB_TOKEN=""
          
          # Remove GH_TOKEN (used by gh CLI)
          unset GH_TOKEN
          export GH_TOKEN=""
          
          # Remove git credential helpers
          git config --global --unset-all credential.helper 2>/dev/null || true
          
          # Remove HTTP Authorization headers
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all http.https://github.com/.extraHeader 2>/dev/null || true
          
          # Remove .netrc if it exists (may contain GITHUB_TOKEN)
          rm -f ~/.netrc 2>/dev/null || true
          
          # Disable terminal prompts
          export GIT_TERMINAL_PROMPT=0
          
          echo "=== Step 2: Verify clean environment ==="
          echo "GIT_ASKPASS='${GIT_ASKPASS}'"
          echo "GITHUB_TOKEN length: ${#GITHUB_TOKEN}"
          echo "git config:"
          git config --global --list 2>/dev/null || echo "(empty)"
          echo ".netrc: $(test -f ~/.netrc && echo 'EXISTS' || echo 'NOT FOUND')"
          
          echo "=== Step 3: Clone raylib ${RAYLIB_VERSION} ==="
          git clone --depth 1 --branch "${RAYLIB_VERSION}" \
            https://github.com/raysan/raylib.git /tmp/raylib
          
          echo "=== Step 4: Build raylib ==="
          cd /tmp/raylib
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_GAMES=OFF \
            -DUSE_EXTERNAL_GLFW=OFF
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          echo "=== raylib ${RAYLIB_VERSION} installed ==="

      # -------------------------------------------------------------------
      # Verify
      # -------------------------------------------------------------------
      - name: Verify dependencies
        run: |
          echo "=== raylib ==="
          pkg-config --modversion raylib 2>/dev/null && echo "OK" || echo "NOT found via pkg-config"
          ls -la /usr/local/lib/libraylib* 2>/dev/null || true
          echo "=== enet ==="
          pkg-config --modversion libenet 2>/dev/null && echo "OK" || echo "NOT found"

      # -------------------------------------------------------------------
      # Configure & Build Kaikai
      # -------------------------------------------------------------------
      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        working-directory: build
        run: make -j$(nproc) 2>&1 | tail -100

      # -------------------------------------------------------------------
      # Upload artifacts
      # -------------------------------------------------------------------
      - name: Upload server binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikai_server-${{ matrix.build_type }}
          path: build/kaikai_server
          if-no-files-found: warn

      - name: Upload client binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikai_client-${{ matrix.build_type }}
          path: build/kaikai_client
          if-no-files-found: warn
