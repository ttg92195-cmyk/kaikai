name: Build Kaikai

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # =========================================================================
  # JOB 1: Build Linux desktop binaries (server + client)
  # =========================================================================
  build-linux:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build_type: [Release]

    steps:
      # -------------------------------------------------------------------
      # Checkout our repo
      # -------------------------------------------------------------------
      - name: Checkout Kaikai repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # Install system dependencies
      # -------------------------------------------------------------------
      - name: Install build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libglfw3-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libmbedtls-dev \
            libgl1-mesa-dev \
            libenet-dev

      # -------------------------------------------------------------------
      # Build and install raylib from source
      #
      # THE REAL FIX (after 14 failed builds):
      #   The raylib repository moved from "raysan/raylib" to "raysan5/raylib"!
      #   All previous builds were trying to download from the OLD URL which
      #   returns 404 (the repo no longer exists at the old location).
      #   It was NEVER an authentication issue - it was a WRONG URL issue!
      #
      #   Correct URL: https://github.com/raysan5/raylib/archive/refs/tags/5.5.tar.gz
      #   Wrong URL:   https://github.com/raysan/raylib/archive/refs/tags/5.5.tar.gz  (404!)
      # -------------------------------------------------------------------
      - name: Build and install raylib from source
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          RAYLIB_VERSION="5.5"
          RAYLIB_URL="https://github.com/raysan5/raylib/archive/refs/tags/${RAYLIB_VERSION}.tar.gz"

          echo "=== Downloading raylib ${RAYLIB_VERSION} from raysan5/raylib ==="
          echo "URL: ${RAYLIB_URL}"

          curl -L --netrc-file /dev/null -o /tmp/raylib.tar.gz "${RAYLIB_URL}" 2>&1

          FILE_SIZE=$(stat -c%s /tmp/raylib.tar.gz 2>/dev/null || echo "0")
          echo "Downloaded: ${FILE_SIZE} bytes"

          if [ "$FILE_SIZE" -lt 10000 ]; then
            echo "ERROR: Download too small! Content:"
            cat /tmp/raylib.tar.gz
            exit 1
          fi

          echo "=== Extracting ==="
          tar xzf /tmp/raylib.tar.gz -C /tmp
          ls /tmp/raylib-${RAYLIB_VERSION}/

          echo "=== Building raylib ==="
          cd /tmp/raylib-${RAYLIB_VERSION}
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_GAMES=OFF \
            -DUSE_EXTERNAL_GLFW=OFF
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          echo "=== raylib ${RAYLIB_VERSION} installed successfully ==="

      # -------------------------------------------------------------------
      # Verify raylib is installed
      # -------------------------------------------------------------------
      - name: Verify raylib installation
        run: |
          echo "=== raylib via pkg-config ==="
          pkg-config --modversion raylib 2>/dev/null && echo "Found!" || echo "NOT found via pkg-config"
          echo "=== raylib library files ==="
          ls -la /usr/local/lib/libraylib* 2>/dev/null || true
          echo "=== raylib cmake config ==="
          ls -la /usr/local/lib/cmake/raylib/ 2>/dev/null || true

      # -------------------------------------------------------------------
      # Configure & Build Kaikai
      # -------------------------------------------------------------------
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH=/usr/local

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config ${{ matrix.build_type }} -- -j$(nproc) 2>&1 | tail -150

      # -------------------------------------------------------------------
      # Upload artifacts
      # -------------------------------------------------------------------
      - name: Upload server binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikai_server-${{ matrix.build_type }}
          path: build/kaikai_server
          if-no-files-found: warn

      - name: Upload client binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikai_client-${{ matrix.build_type }}
          path: build/kaikai_client
          if-no-files-found: warn

  # =========================================================================
  # JOB 2: Build Android APK (arm64-v8a)
  # =========================================================================
  build-android:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------------------
      # Checkout our repo
      # -------------------------------------------------------------------
      - name: Checkout Kaikai repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # Setup JDK 17 (required by Android Gradle Plugin 8.x)
      # -------------------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # -------------------------------------------------------------------
      # Setup Android SDK and install NDK + build tools
      # -------------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android NDK and build tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV

      # -------------------------------------------------------------------
      # Build raylib for Android (arm64-v8a, OpenGL ES 3.0)
      # -------------------------------------------------------------------
      - name: Build raylib for Android
        run: |
          RAYLIB_VERSION="5.5"
          git clone https://github.com/raysan5/raylib.git --branch ${RAYLIB_VERSION} --depth 1 /tmp/raylib

          echo "=== Building raylib ${RAYLIB_VERSION} for Android arm64-v8a ==="
          mkdir -p /tmp/raylib/build-android && cd /tmp/raylib/build-android
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DPLATFORM=Android \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/raylib-android \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_GAMES=OFF \
            -DUSE_EXTERNAL_GLFW=OFF
          make -j$(nproc)
          make install
          echo "=== raylib for Android installed to /tmp/raylib-android ==="
          ls -la /tmp/raylib-android/lib/

      # -------------------------------------------------------------------
      # Build native shared library (libkaikai_android.so) with CMake
      # -------------------------------------------------------------------
      - name: Configure CMake for Android
        run: |
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/raylib-android \
            -DANDROID_STL=c++_static

      - name: Build native library
        run: |
          cmake --build build-android --config Release -j$(nproc) 2>&1 | tail -200

      # -------------------------------------------------------------------
      # Copy native library to Android project's jniLibs directory
      # -------------------------------------------------------------------
      - name: Prepare native library for APK packaging
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          if [ -f build-android/libkaikai_android.so ]; then
            cp build-android/libkaikai_android.so android/app/src/main/jniLibs/arm64-v8a/
            echo "=== libkaikai_android.so copied to jniLibs ==="
            ls -la android/app/src/main/jniLibs/arm64-v8a/
          else
            echo "ERROR: libkaikai_android.so not found in build-android/"
            ls -la build-android/*.so 2>/dev/null || true
            find build-android -name "*.so" 2>/dev/null || true
            exit 1
          fi

      # -------------------------------------------------------------------
      # Setup Gradle and build APK
      # -------------------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      # -------------------------------------------------------------------
      # Upload APK artifact
      # -------------------------------------------------------------------
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikai-android-arm64-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
