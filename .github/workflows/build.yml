name: Build Kaikai

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
      # -------------------------------------------------------------------
      # Checkout our repo
      # -------------------------------------------------------------------
      - name: Checkout Kaikai repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # Install system dependencies
      # -------------------------------------------------------------------
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libenet-dev \
            libglfw3-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libmbedtls-dev \
            libgl1-mesa-dev

      # -------------------------------------------------------------------
      # raylib - bypass ALL git credential interference
      # The runner's actions/checkout sets up GITHUB_TOKEN credential helper
      # that intercepts ALL github.com access and blocks other public repos.
      # Fix: create a completely clean git config environment for the clone.
      # -------------------------------------------------------------------
      - name: Clone and build raylib
        env:
          # Ignore system git config (has credential helper)
          GIT_CONFIG_NOSYSTEM: 1
          # Don't prompt for credentials - just fail or use anonymous
          GIT_TERMINAL_PROMPT: 0
        run: |
          RAYLIB_VERSION="5.0"
          
          echo "=== Creating clean git config to bypass credential interference ==="
          # Create a completely clean temporary gitconfig with NO credential helpers
          CLEAN_GITCONFIG="/tmp/clean-gitconfig"
          cat > "$CLEAN_GITCONFIG" << 'EOF'
          [user]
              name = CI Builder
              email = builder@ci.local
          EOF
          
          # Point git to our clean config instead of the runner's infected one
          export GIT_CONFIG_GLOBAL="$CLEAN_GITCONFIG"
          
          echo "=== Cloning raylib ${RAYLIB_VERSION} (anonymous, no credentials) ==="
          git clone --depth 1 --branch "${RAYLIB_VERSION}" \
            https://github.com/raysan/raylib.git /tmp/raylib
          
          echo "=== Building raylib ==="
          cd /tmp/raylib
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_GAMES=OFF \
            -DUSE_EXTERNAL_GLFW=OFF
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          echo "=== raylib ${RAYLIB_VERSION} installed successfully ==="

      # -------------------------------------------------------------------
      # Verify
      # -------------------------------------------------------------------
      - name: Verify dependencies
        run: |
          echo "=== raylib ==="
          pkg-config --modversion raylib 2>/dev/null && echo "OK" || echo "NOT found via pkg-config"
          ls -la /usr/local/lib/libraylib* 2>/dev/null || true
          echo "=== enet ==="
          pkg-config --modversion libenet 2>/dev/null && echo "OK" || echo "NOT found"

      # -------------------------------------------------------------------
      # Configure & Build Kaikai
      # -------------------------------------------------------------------
      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        working-directory: build
        run: make -j$(nproc) 2>&1 | tail -100

      # -------------------------------------------------------------------
      # Upload artifacts
      # -------------------------------------------------------------------
      - name: Upload server binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikai_server-${{ matrix.build_type }}
          path: build/kaikai_server
          if-no-files-found: warn

      - name: Upload client binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikai_client-${{ matrix.build_type }}
          path: build/kaikai_client
          if-no-files-found: warn
