name: Build Kaikai

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build_type: [Release]

    steps:
      # -------------------------------------------------------------------
      # Checkout our repo
      # -------------------------------------------------------------------
      - name: Checkout Kaikai repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # Install system dependencies
      # -------------------------------------------------------------------
      - name: Install build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libglfw3-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libmbedtls-dev \
            libgl1-mesa-dev \
            libenet-dev

      # -------------------------------------------------------------------
      # Build and install raylib from source
      #
      # CRITICAL: Why downloads kept failing (Builds #1-#13):
      #   - actions/checkout creates ~/.netrc with GITHUB_TOKEN
      #   - curl/wget AUTO-READ ~/.netrc and send the token to github.com
      #   - The scoped token only works for OUR repo, NOT raysan/raylib
      #   - GitHub REJECTS the bad token and does NOT fall back to anonymous
      #
      # Fix: Use curl --netrc-file /dev/null to bypass .netrc completely
      #      AND set GITHUB_TOKEN="" in env to prevent env-based auth
      # -------------------------------------------------------------------
      - name: Build and install raylib from source
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          GIT_ASKPASS: ""
        run: |
          # Remove .netrc (contains GITHUB_TOKEN that curl/wget auto-sends)
          rm -f ~/.netrc 2>/dev/null || true

          # Remove git auth headers (just in case)
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all http.https://github.com/.extraHeader 2>/dev/null || true

          # Try downloading raylib - multiple versions as fallback
          RAYLIB_VERSIONS=("5.0" "4.5.0" "5.5")
          DOWNLOADED=false
          RAYLIB_DIR=""

          for VER in "${RAYLIB_VERSIONS[@]}"; do
            URL="https://github.com/raysan/raylib/archive/refs/tags/${VER}.tar.gz"
            echo "--- Trying raylib ${VER}: ${URL} ---"

            # --netrc-file /dev/null = bypass ~/.netrc completely
            # -L = follow redirects (GitHub archive URLs redirect to CDN)
            # -w = print HTTP status code
            HTTP_CODE=$(curl -L --netrc-file /dev/null -o /tmp/raylib.tar.gz \
              -w "%{http_code}" "${URL}" 2>&1) || true

            FILE_SIZE=$(stat -c%s /tmp/raylib.tar.gz 2>/dev/null || echo "0")
            echo "HTTP Status: ${HTTP_CODE}"
            echo "File size: ${FILE_SIZE} bytes"

            if [ "$FILE_SIZE" -gt 10000 ]; then
              echo "SUCCESS: Downloaded raylib ${VER} (${FILE_SIZE} bytes)"
              DOWNLOADED=true
              RAYLIB_DIR="raylib-${VER}"
              break
            else
              echo "FAILED: Too small or error page. Content:"
              head -c 500 /tmp/raylib.tar.gz
              echo ""
            fi
          done

          if [ "$DOWNLOADED" = false ]; then
            echo "FATAL: Could not download raylib from any version!"
            echo "Trying codeload.github.com as last resort..."
            curl -L --netrc-file /dev/null -o /tmp/raylib.tar.gz \
              -w "%{http_code}" \
              "https://codeload.github.com/raysan/raylib/tar.gz/5.0" 2>&1 || true
            FILE_SIZE=$(stat -c%s /tmp/raylib.tar.gz 2>/dev/null || echo "0")
            echo "File size: ${FILE_SIZE} bytes"
            if [ "$FILE_SIZE" -gt 10000 ]; then
              DOWNLOADED=true
              RAYLIB_DIR="raylib-5.0"
            else
              exit 1
            fi
          fi

          echo "=== Extracting ${RAYLIB_DIR} ==="
          tar xzf /tmp/raylib.tar.gz -C /tmp
          ls /tmp/${RAYLIB_DIR}/

          echo "=== Building raylib ==="
          cd /tmp/${RAYLIB_DIR}
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_GAMES=OFF \
            -DUSE_EXTERNAL_GLFW=OFF
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          echo "=== raylib installed successfully ==="

      # -------------------------------------------------------------------
      # Verify raylib is installed
      # -------------------------------------------------------------------
      - name: Verify raylib installation
        run: |
          echo "=== raylib via pkg-config ==="
          pkg-config --modversion raylib 2>/dev/null && echo "Found!" || echo "NOT found via pkg-config"
          echo "=== raylib library files ==="
          ls -la /usr/local/lib/libraylib* 2>/dev/null || true
          echo "=== raylib cmake config ==="
          ls -la /usr/local/lib/cmake/raylib/ 2>/dev/null || true

      # -------------------------------------------------------------------
      # Configure & Build Kaikai
      # -------------------------------------------------------------------
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH=/usr/local

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -- -j$(nproc) 2>&1 | tail -150

      # -------------------------------------------------------------------
      # Upload artifacts
      # -------------------------------------------------------------------
      - name: Upload server binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikai_server-${{ matrix.build_type }}
          path: build/kaikai_server
          if-no-files-found: warn

      - name: Upload client binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikai_client-${{ matrix.build_type }}
          path: build/kaikai_client
          if-no-files-found: warn
