name: Build Kaikai

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build_type: [Release]

    steps:
      # -------------------------------------------------------------------
      # Checkout our repo
      # -------------------------------------------------------------------
      - name: Checkout Kaikai repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # Install ALL system dependencies including raylib from apt
      # This completely avoids the GitHub authentication issue that
      # prevented git clone / curl / wget from downloading raylib
      # from the raysan/raylib repository (Builds #1-#11 all failed).
      # -------------------------------------------------------------------
      - name: Install build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libraylib-dev \
            libenet-dev \
            libglfw3-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libmbedtls-dev \
            libgl1-mesa-dev

      # -------------------------------------------------------------------
      # Verify raylib is installed
      # -------------------------------------------------------------------
      - name: Verify raylib installation
        run: |
          echo "=== raylib version ==="
          pkg-config --modversion raylib 2>/dev/null || echo "raylib not found via pkg-config"
          echo "=== raylib libs ==="
          pkg-config --libs raylib 2>/dev/null || echo "no pkg-config info"
          echo "=== raylib cflags ==="
          pkg-config --cflags raylib 2>/dev/null || echo "no pkg-config info"
          echo "=== enet version ==="
          pkg-config --modversion libenet 2>/dev/null || echo "enet not found"
          echo "=== library files ==="
          ls -la /usr/lib/x86_64-linux-gnu/libraylib* 2>/dev/null || true
          ls -la /usr/lib/x86_64-linux-gnu/libenet* 2>/dev/null || true

      # -------------------------------------------------------------------
      # Configure & Build
      # -------------------------------------------------------------------
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -- -j$(nproc) 2>&1 | tail -150

      # -------------------------------------------------------------------
      # Upload artifacts
      # -------------------------------------------------------------------
      - name: Upload server binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikai_server-${{ matrix.build_type }}
          path: build/kaikai_server
          if-no-files-found: warn

      - name: Upload client binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikai_client-${{ matrix.build_type }}
          path: build/kaikai_client
          if-no-files-found: warn
